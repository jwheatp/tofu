name: decisions
on: { workflow_call: {} }
jobs:
  decisions:
    if: github.base_ref == 'staging' || github.base_ref == 'main' || github.ref_name == 'staging' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions: { issues: read, contents: read }
    steps:
      - name: Required labels on linked feature issues
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          BR="${{ github.head_ref || github.ref_name }}"
          N=$(echo "$BR" | sed -nE 's#^(feature|hotfix)/([0-9]+)-.*#\2#p')
          [ -z "$N" ] && { echo "No feature branch: skipping"; exit 0; }
          LABELS=$(gh issue view "$N" --repo "${{ github.repository }}" --json labels -q '.labels[].name')
          NEED=tofu:approved; [ "${{ github.base_ref }}" = main ] && NEED="tofu:approved tofu:accepted"
          for L in $NEED; do echo "$LABELS" | grep -qx "$L" || echo "$LABELS" | grep -qx "tofu:override" || { echo "::error::missing $L on #$N"; exit 1; }; done
