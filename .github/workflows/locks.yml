name: locks
on: { workflow_call: {} }
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tests/specs must not change together with src without Approve refresh
        run: |
          BASE=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD || echo HEAD~1)
          CH=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CH" | grep -qE '^(tests|e2e|features)/' && echo "$CH" | grep -q '^src/'; then
            git log "$BASE"..HEAD --format=%B | grep -q 'Tofu-Approve-Refresh' || { echo "::error::tests/specs and src changed together without 'Tofu-Approve-Refresh' in a commit message"; exit 1; }
          fi
      - name: No added skips or deleted assertions
        run: |
          BASE=$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD || echo HEAD~1)
          git diff "$BASE"...HEAD -U0 -- tests e2e | grep -E '^\+.*(\.skip|xit\(|xdescribe|it\.todo)' && { echo "::error::skipped test added"; exit 1; } || true
          [ "$(git diff "$BASE"...HEAD -U0 -- tests e2e | grep -cE '^-.*expect\(')" -le "$(git diff "$BASE"...HEAD -U0 -- tests e2e | grep -cE '^\+.*expect\(')" ] || { echo "::error::assertions deleted"; exit 1; }
